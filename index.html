    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School House Childcare | Coquitlam</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght=400;600;700&family=Nunito:wght=400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2A5C9A;
            --soft-green: #5BB318;
            --warm-orange: #F99417;
            --bg-light: #FDFDFD;
            --text-main: #2D3436;
        }

        /* Image transparency & quality fix */
        .header-logo img, .hero-img {
            mix-blend-mode: multiply;
            filter: contrast(120%);
        }

        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-main);
            background-color: var(--bg-light);
            scroll-behavior: smooth;
        }

        header {
            background: #fff;
            padding: 10px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-left-link {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .header-logo { height: 60px; display: flex; align-items: center; }
        .header-logo img { height: 100%; width: auto; }

        .brand-text {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--primary-blue);
            line-height: 1;
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.9rem;
        }

        nav a:hover { color: var(--warm-orange); }

        .hero {
            background: linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,0.8)), 
                        url('https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            text-align: center;
            padding: 100px 10%;
        }

        .hero-img { max-width: 180px; margin-bottom: 20px; }
        .hero h1 { font-family: 'Quicksand'; font-size: 3.2rem; color: var(--primary-blue); margin: 0; line-height: 1.2; }
        .hero p { font-size: 1.2rem; margin-top: 15px; color: #555; }

        section { padding: 80px 10%; border-bottom: 1px solid #eee; }
        h2 { font-family: 'Quicksand'; font-size: 2.2rem; text-align: center; color: var(--primary-blue); margin-bottom: 40px; }
         
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .card { background: #fff; padding: 35px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-bottom: 4px solid var(--soft-green); }
        .card h3 { color: var(--primary-blue); font-family: 'Quicksand'; margin-top: 0; }

        .feature-list { list-style: none; padding: 0; }
        .feature-list li { margin-bottom: 15px; padding-left: 30px; position: relative; }
        .feature-list li::before { content: '✓'; position: absolute; left: 0; color: var(--soft-green); font-weight: bold; }

        .schedule-box { background: var(--primary-blue); color: white; padding: 40px; border-radius: 30px; max-width: 800px; margin: 0 auto; }
        .schedule-item { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.2); padding: 12px 0; }

        .safety-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .safety-card { background: #f0f7ff; padding: 25px; border-radius: 20px; border-left: 5px solid var(--warm-orange); }

        /* Prominent Methodologies Section Styling */
        .methodologies-card {
            background: white;
            max-width: 750px;
            margin: 0 auto;
            padding: 50px 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(42, 92, 154, 0.08);
            border-top: 6px solid var(--warm-orange);
        }
         
        .methodologies-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .methodologies-card p {
            font-size: 1.25rem;
            line-height: 1.6;
            color: #4a5568;
            margin-bottom: 35px;
        }

        .cta-button-prominent {
            display: inline-block;
            background: var(--warm-orange);
            color: white;
            border: none;
            padding: 20px 45px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.15rem;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(249, 148, 23, 0.4);
            transition: all 0.3s ease;
        }

        .cta-button-prominent:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(249, 148, 23, 0.5);
            background: #e08310;
        }

        .cta-button-prominent:active {
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(249, 148, 23, 0.4);
        }

        /* Footer Layout Styles */
        .site-footer {
            background: #2D3436;
            color: white;
            padding: 40px 10%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 30px;
        }

        .footer-left {
            flex: 1;
            min-width: 250px;
            text-align: left;
        }

        .footer-left p { margin: 5px 0; }
        .footer-left .copyright { opacity: 0.5; font-size: 0.8rem; margin-top: 15px; }

        .footer-right { text-align: right; min-width: 150px; }
        .footer-right h3 {
            font-family: 'Quicksand', sans-serif;
            color: var(--warm-orange);
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .footer-nav { display: flex; flex-direction: column; gap: 10px; }
        .footer-nav a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }
        .footer-nav a:hover { color: var(--soft-green); }

        /* Responsive Mobile Breakpoint Fixes */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 12px;
                padding: 15px 5%;
            }

            /* Brought back navigation row styling for mobile screens */
            nav { 
                display: flex; 
                flex-wrap: wrap;
                justify-content: center;
                gap: 12px;
            }
            
            nav a {
                margin-left: 0; 
                padding: 4px 6px;
                font-size: 0.85rem;
            }

            .hero h1 { font-size: 2.2rem; }
            .brand-text { display: none; } /* Hides the brand typography on small devices to prioritize layout space */
            
            .methodologies-card { padding: 40px 20px; }
            .methodologies-card p { font-size: 1.1rem; }
            .cta-button-prominent { padding: 18px 30px; font-size: 1rem; width: 85%; }
            
            .site-footer { flex-direction: column; text-align: center; align-items: center; padding: 40px 5%; }
            .footer-left, .footer-right { text-align: center; width: 100%; }
            .footer-right h3 { margin-top: 10px; }
        }
    </style>
</head>
